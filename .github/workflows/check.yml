name: Cloud checks and Studio artifacts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned tools
        run: bash scripts/bootstrap.sh
      - name: Test and build
        run: bash scripts/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Riftwake-Studio-${{ github.sha }}
          path: |
            build/*.rbxl
            build/*.rbxlx
            build/*.txt
            build/SHA256SUMS
            build/ascension-readiness.json
            assets/ascension/previews/*.png
            assets/ascension/manifest.json
            assets/previews/*.png
          retention-days: 14
